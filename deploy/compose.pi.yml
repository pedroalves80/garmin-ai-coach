# Copy to docker-home/docker-compose.coach.yml. This is an independent project.
name: garmin-ai-coach
services:
  coach:
    image: ${GARMIN_COACH_WEB_IMAGE:-${GARMIN_COACH_IMAGE:-garmin-ai-coach:633b04f-arm64}}
    container_name: garmin-ai-coach
    env_file:
      - path: ./configs/garmin-ai-coach/coach.env
        format: raw
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=256
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/coach.db
      TZ: Europe/Lisbon
    ports:
      - "${GARMIN_COACH_BIND_IP:-127.0.0.1}:3100:3000"
    volumes:
      - type: bind
        source: ./data/garmin-ai-coach
        target: /app/data
        bind:
          create_host_path: false
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy_network
      traefik.http.routers.garmin-coach.rule: Host(`coach.home.arpa`)
      traefik.http.routers.garmin-coach.entrypoints: websecure
      traefik.http.routers.garmin-coach.tls: "true"
      traefik.http.services.garmin-coach.loadbalancer.server.port: "3000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=32m,uid=1001,gid=1001,mode=0700
    cpus: 0.75
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/garmin/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  garmin-worker:
    image: ${GARMIN_COACH_IMAGE:-garmin-ai-coach:633b04f-arm64}
    container_name: garmin-ai-coach-worker
    env_file:
      - path: ./configs/garmin-ai-coach/coach.env
        format: raw
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DATABASE_PATH: /app/data/coach.db
      TZ: Europe/Lisbon
    command: [node, build/worker/server/garmin/worker.js]
    volumes:
      - type: bind
        source: ./data/garmin-ai-coach
        target: /app/data
        bind:
          create_host_path: false
    networks:
      - worker-egress
    labels:
      traefik.enable: "false"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test:
        - CMD
        - node
        - --max-old-space-size=32
        - -e
        - 'const D=require("better-sqlite3"),{autoSyncStatus}=require("./build/worker/server/garmin/scheduler");const d=new D(process.env.DATABASE_PATH,{readonly:true,fileMustExist:true});try{process.exitCode=autoSyncStatus(d,true).workerOnline?0:1;}finally{d.close();}'
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  proxy:
    external: true
    name: proxy_network
  worker-egress:
    driver: bridge
